
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow
          image: student-task-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-service
spec:
  type: NodePort
  selector:
    app: taskflow
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
